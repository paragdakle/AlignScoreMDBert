# Tiny CPU run that exercises the whole pipeline (see scripts/smoke_test.sh).
tokenizer_max_length: 1024
max_tokens_per_batch: 2048
eval_max_tokens_per_batch: 4096
batch_size: 8
eval_batch_size: 8
max_samples_per_dataset: 40
max_val_samples_per_dataset: 24
max_train_eval_examples: 16
max_steps: 6
val_check_interval: 3
limit_val_batches: 1.0
num_workers: 0
length_workers: 1
accelerator: cpu
devices: [1]
precision: "32"
log_every_n_steps: 1
save_every_n_steps: 3
